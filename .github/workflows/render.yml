name: Render Python course
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install PDF typesetting tools
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-freefont-otf
      - name: Execute notebooks and build HTML and PDF
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: teaching-genai-html-and-pdf
          path: _build/html/
