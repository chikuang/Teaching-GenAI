name: Render Python course
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
      - run: python -m pip install -r requirements.txt
      - name: Export notebook and execute course
        run: |
          quarto convert 01-python-lab.qmd --output notebooks/01-python-lab.ipynb
          quarto render
      - uses: actions/upload-artifact@v4
        with:
          name: teaching-genai-html
          path: _book/
